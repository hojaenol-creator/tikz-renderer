<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>External Full Renderer</title>
  <link rel="stylesheet" type="text/css" href="https://tikzjax.com/v1/fonts.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap">
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; margin: 0; color: #333; background: #fff; }
    .q-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #555; border-bottom: 2px solid #eee; padding-bottom: 5px; }
    .q-body { font-size: 16px; line-height: 1.6; margin-bottom: 20px; }
    .q-choices { list-style-type: none; padding: 0; }
    .q-choices li { padding: 10px; margin-bottom: 8px; background: #f8f9fa; border-radius: 6px; border: 1px solid #e9ecef; font-size: 16px; }
    .q-choices li .choice-index { font-weight: bold; color: #007bff; margin-right: 8px; }
    .tikz-container { margin-top: 15px; margin-bottom: 15px; text-align: center; padding: 15px; background: #f8f9fa; border-radius: 8px; border: 1px dashed #ccc; }
    .q-tikz { background: #e9ecef; padding: 10px; font-family: monospace; font-size: 12px; white-space: pre-wrap; margin-top: 10px; text-align: left; }
    #error-msg { color: #fff; background: #ff6b6b; font-weight: bold; display: none; padding: 10px; border-radius: 4px; margin-bottom: 15px; }
    .btn { background: #6c757d; color: white; border: none; padding: 6px 12px; font-size: 12px; cursor: pointer; border-radius: 4px; }
    .btn:hover { background: #5a6268; }
    .image-placeholder { display: inline-block; margin: 10px 0; padding: 6px 12px; background: #fff3cd; border: 1px solid #ffc107; border-radius: 4px; color: #856404; font-size: 13px; }
    .latex-table { border-collapse: collapse; margin: 12px auto; font-size: inherit; font-family: inherit; }
    .latex-table td { padding: 4px 14px; }

    /* ── 캡처 버튼 ── */
    #captureBar { position: relative; z-index: 100; background: #f8f9fa; padding: 12px 16px; border-bottom: 2px solid #ddd; margin: -20px -20px 20px -20px; text-align: center; }
    #captureBar button { background: #ccc; color: #fff; border: none; padding: 10px 20px; font-size: 14px; font-weight: bold; cursor: not-allowed; border-radius: 6px; margin-right: 8px; transition: all 0.3s; }
    #captureBar.ready button { cursor: pointer; }
    #captureBar.ready button.primary { background: #e74c3c; }
    #captureBar.ready button.primary:hover { background: #c0392b; }
    #captureBar.ready button.secondary { background: #3498db; }
    #captureBar.ready button.secondary:hover { background: #2980b9; }
    #captureBar .status { font-size: 12px; color: #999; margin-left: 8px; }

    /* ── 캡처 전용 스타일 (흑백 시험지) ── */
    #captureTarget {
      display: none;
      font-family: 'Times New Roman', 'Noto Serif', Georgia, serif;
      font-size: 16px;
      line-height: 1.6;
      color: #000;
      background: #fff;
      padding: 12px 20px;
      max-width: 780px;
    }
    /* 문항 본문: 번호+본문 인라인 */
    #captureTarget .q-inline-body { font-size: 16px; line-height: 1.6; margin-bottom: 6px; }
    #captureTarget .q-inline-body .q-number { font-weight: bold; }

    /* 객관식: 4열 균등 그리드 */
    #captureTarget .q-choices-grid {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 2px 8px; padding: 0; margin: 4px 0 0 0; list-style: none;
    }
    #captureTarget .q-choices-grid li {
      font-size: 16px; line-height: 1.6; padding: 0; margin: 0;
      background: none; border: none; border-radius: 0; white-space: nowrap;
    }
    #captureTarget .q-choices-grid li .choice-index { font-weight: bold; margin-right: 2px; }
    /* 객관식 선지가 길 경우 2열 폴백 */
    #captureTarget .q-choices-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
    /* 객관식 선지가 매우 길 경우 1열 폴백 */
    #captureTarget .q-choices-grid.cols-1 { grid-template-columns: 1fr; }

    /* 참거짓: 하위 문항 */
    #captureTarget .q-sub-items { padding: 0; margin: 4px 0 0 0; list-style: none; }
    #captureTarget .q-sub-items li { font-size: 16px; line-height: 1.6; padding: 0; margin: 0 0 2px 0; }
    #captureTarget .q-sub-items li .sub-index { font-weight: bold; margin-right: 2px; }

    /* TikZ SVG */
    #captureTarget .tikz-svg-inline { text-align: center; margin: 10px auto; overflow: hidden; }
    #captureTarget .tikz-svg-inline svg { display: block; margin: 0 auto; max-width: 100%; max-height: 500px; width: auto; height: auto; }
    #captureTarget .latex-table { border-collapse: collapse; margin: 10px auto; font-size: inherit; font-family: inherit; color: #000; }
    #captureTarget .latex-table td { padding: 4px 14px; }

    /* ── 캡처 설정 모달 ── */
    .capture-modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 9999; justify-content: center; align-items: center; }
    .capture-modal-overlay.active { display: flex; }
    .capture-modal { background: #fff; border-radius: 12px; padding: 28px 32px; width: 360px; box-shadow: 0 8px 30px rgba(0,0,0,0.25); font-family: 'Segoe UI', sans-serif; }
    .capture-modal h3 { margin: 0 0 20px 0; font-size: 18px; color: #333; }
    .capture-modal label { display: block; font-size: 13px; font-weight: bold; color: #555; margin-bottom: 4px; }
    .capture-modal input, .capture-modal select { width: 100%; padding: 8px 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 16px; box-sizing: border-box; }
    .capture-modal .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
    .capture-modal .modal-actions button { padding: 9px 18px; font-size: 14px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; }
    .capture-modal .modal-actions .btn-cancel { background: #e9ecef; color: #555; }
    .capture-modal .modal-actions .btn-go { background: #e74c3c; color: #fff; }
    .capture-modal .modal-actions .btn-go.dl { background: #3498db; }
  </style>

  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
      startup: { typeset: false }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>

  <div id="captureBar">
    <button class="primary" id="btnCapture" disabled onclick="captureAsPng()">📸 Capture PNG (New Tab)</button>
    <button class="secondary" id="btnDownload" disabled onclick="captureAndDownload()">💾 Save PNG</button>
    <span class="status" id="captureStatus">문항을 불러오면 활성화됩니다</span>
  </div>

  <div id="error-msg"></div>
  <div id="content">
     <h2 style="color:#ccc; text-align:center; margin-top:30vh;">
       👈 '미리보기 렌더링' 버튼을 누르면<br>여기에 문제가 렌더링됩니다.
     </h2>
  </div>

  <!-- 캡처 전용 (숨겨진 영역) -->
  <div id="captureTarget"></div>

  <!-- 캡처 설정 모달 -->
  <div class="capture-modal-overlay" id="captureModal">
    <div class="capture-modal">
      <h3>📸 Capture Setting</h3>
      <label for="qNumber">Question Index</label>
      <input type="text" id="qNumber" placeholder="예: Câu 1, Câu 2..." value="">
      <label for="qType">Question Type</label>
      <select id="qType">
        <option value="multiple_choice">Multiple Choice</option>
        <option value="true_false">True/False</option>
        <option value="open_ended">Open Ended</option>
      </select>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-go" id="modalConfirmBtn">Confirm</button>
      </div>
    </div>
  </div>

  <script>
    /* ══════════════════════════════════════════
       유틸리티 함수
    ══════════════════════════════════════════ */

    function cleanLatex(str) {
      if (str === null || str === undefined) return "";
      if (typeof str !== 'string') str = String(str);
      return str.replace(/\\\\/g, '\\').replace(/\u00A0/g, ' ');
    }

    /* ── 본문 전처리: 표 변환 → 백슬래시 정리 순서 보장 ── */
    function prepareBody(rawBody) {
      var text = (rawBody === null || rawBody === undefined) ? "" : String(rawBody);
      text = text.replace(/\u00A0/g, ' ');
      // 1) 표를 먼저 HTML로 변환 (\\가 행 구분자로 살아있는 상태에서)
      text = convertTablesToHtml(text);
      // 2) 나머지 텍스트에서 백슬래시 정리 (MathJax용)
      text = text.replace(/\\\\/g, '\\');
      return text;
    }

    /* ── LaTeX 표 → HTML <table> 자동 변환 ── */
    function convertTablesToHtml(text) {
      // $$\begin{array}{spec}...\end{array}$$
      text = text.replace(
        /\$\$\s*\\begin\{array\}\s*\{([^}]*)\}([\s\S]*?)\\end\{array\}\s*\$\$/g,
        function(m, spec, body) { return parseLatexTable(spec, body); }
      );
      // \begin{tabular}{spec}...\end{tabular}
      text = text.replace(
        /\\begin\{tabular\}\s*\{([^}]*)\}([\s\S]*?)\\end\{tabular\}/g,
        function(m, spec, body) { return parseLatexTable(spec, body); }
      );
      return text;
    }

    function parseLatexTable(colSpec, rawContent) {
      // 1. 컬럼 정렬 및 테두리 파싱
      var aligns = [];
      var hasVertBorders = colSpec.indexOf('|') >= 0;
      for (var i = 0; i < colSpec.length; i++) {
        if ('clr'.indexOf(colSpec[i]) >= 0) aligns.push(colSpec[i]);
      }

      // 2. \hline 존재 여부 확인 (1개 이상의 백슬래시 + hline)
      var hasHline = /\\+hline/.test(rawContent);

      // 3. hline 제거 (백슬래시 개수 무관하게)
      var content = rawContent.replace(/\\+hline/g, '');

      // 4. 행 분리: 연속된 2개 이상의 백슬래시(\\)를 행 구분자로 사용
      var rows = content.split(/\\{2,}/)
        .map(function(r) { return r.trim(); })
        .filter(function(r) { return r.length > 0; });

      // 5. 테두리 방식 결정
      var fullBorder = hasVertBorders && hasHline;
      var borderCSS = '1px solid #000';

      // 6. HTML 생성
      var html = '<table class="latex-table"' +
        (fullBorder ? ' style="border:' + borderCSS + ';"' : '') + '>';

      rows.forEach(function(row) {
        var cells = row.split('&').map(function(c) { return c.trim(); });
        html += '<tr>';
        cells.forEach(function(cell, cIdx) {
          var align = aligns[cIdx] || 'c';
          var ta = align === 'l' ? 'left' : (align === 'r' ? 'right' : 'center');
          var styles = ['text-align:' + ta];
          if (fullBorder) styles.push('border:' + borderCSS);
          html += '<td style="' + styles.join(';') + '">' + processTableCell(cell) + '</td>';
        });
        html += '</tr>';
      });

      html += '</table>';
      return html;
    }

    function processTableCell(cell) {
      // 감싸는 {} 제거: {[40,45)} → [40,45)
      if (cell.match(/^\{([\s\S]*)\}$/)) cell = cell.replace(/^\{([\s\S]*)\}$/, '$1');
      // \text{...} → 일반 텍스트
      cell = cell.replace(/\\text\{([^}]*)\}/g, '$1');
      // 남은 LaTeX 명령어가 있으면 $...$ 래핑 (MathJax 처리용)
      if (cell.match(/[\\^_]/) || (cell.match(/\{/) && cell.match(/\}/))) {
        cell = '$' + cell + '$';
      }
      return cell;
    }

    function normalizeGraphics(graphics) {
      if (!graphics) return [];
      if (Array.isArray(graphics)) return graphics;
      return [graphics];
    }

    function normalizeChoices(choices) {
      if (!choices || !Array.isArray(choices)) return [];
      var labels = ['A','B','C','D','E','F','G','H','I','J'];
      return choices.map(function(c, i) {
        if (typeof c === 'string') return { index: labels[i] || String(i + 1), text: c };
        return { index: c.index || labels[i] || String(i + 1), text: c.text || '' };
      });
    }

    // 현재 렌더링된 JSON 데이터 보관 (캡처 시 재사용)
    var currentParsedData = null;

    /* ══════════════════════════════════════════
       TikZ iframe 블록 생성 (미리보기용)
    ══════════════════════════════════════════ */
    function createTikzBlock(graphicItem) {
      var cleanTikzCode = cleanLatex(graphicItem.tikzCode);

      var tikzWrapper = document.createElement('div');
      tikzWrapper.className = 'tikz-container';
      tikzWrapper.innerHTML = '<div style="font-weight:bold; color: #007bff; margin-bottom: 10px;">[AI 생성 그래프 (TikZ)]</div>';

      if (graphicItem.originalUrl) {
        var linkDiv = document.createElement('div');
        linkDiv.style.marginBottom = '10px';
        linkDiv.innerHTML = '<a href="' + graphicItem.originalUrl + '" target="_blank" style="color:#007bff; text-decoration: none; font-weight: bold;">📷 원본 이미지 보기 (새창)</a>';
        tikzWrapper.appendChild(linkDiv);
      }

      var iframe = document.createElement('iframe');
      iframe.style.width = '100%';
      iframe.style.height = '100%';
      iframe.style.border = 'none';
      iframe.style.background = 'transparent';
      iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin');

      var resizeWrap = document.createElement('div');
      resizeWrap.style.cssText = 'resize: vertical; overflow: hidden; border: 1px solid #ccc; border-radius: 4px; padding: 0; min-height: 150px; max-height: 1200px; height: 450px; position: relative;';
      resizeWrap.appendChild(iframe);

      var resizeHint = document.createElement('div');
      resizeHint.style.cssText = 'text-align: right; font-size: 11px; color: #999; margin-top: 4px;';
      resizeHint.textContent = '↕ 아래쪽 모서리를 드래그하여 크기 조절';

      tikzWrapper.appendChild(resizeWrap);
      tikzWrapper.appendChild(resizeHint);

      var toggleArea = document.createElement('div');
      toggleArea.style.marginTop = '10px';
      var toggleBtn = document.createElement('button');
      toggleBtn.className = 'btn';
      toggleBtn.textContent = '💻 원본 TikZ 코드 보기/숨기기';
      var rawCodeDiv = document.createElement('div');
      rawCodeDiv.className = 'q-tikz';
      rawCodeDiv.style.display = 'none';
      rawCodeDiv.textContent = cleanTikzCode;
      toggleBtn.addEventListener('click', function() {
        rawCodeDiv.style.display = (rawCodeDiv.style.display === 'none') ? 'block' : 'none';
      });
      toggleArea.appendChild(toggleBtn);
      toggleArea.appendChild(rawCodeDiv);
      tikzWrapper.appendChild(toggleArea);

      var iframeRef = iframe;
      var tikzCode = cleanTikzCode;
      requestAnimationFrame(function() {
        try {
          var iframeDoc = iframeRef.contentWindow.document;
          iframeDoc.open();
          iframeDoc.write(
            '<!DOCTYPE html>\n<html>\n<head>\n' +
            '  <meta charset="utf-8">\n' +
            '  <link rel="stylesheet" type="text/css" href="https://tikzjax.com/v1/fonts.css">\n' +
            '  <style>\n' +
            '    body { margin: 0; padding: 10px; text-align: center; background: transparent; overflow: auto; }\n' +
            '    svg { max-width: 100%; height: auto; display: inline-block; }\n' +
            '    .tikz-loading { color: #999; font-family: "Segoe UI", sans-serif; font-size: 14px; text-align: center; padding: 20px; }\n' +
            '  </style>\n</head>\n<body>\n' +
            '  <div class="tikz-loading" id="loadingMsg">⏳ TikZ 그래프 렌더링 중...</div>\n' +
            '  <script type="text/tikz">\n' + tikzCode + '\n  <\/script>\n' +
            '  <script>\n' +
            '    var s = document.createElement("script");\n' +
            '    s.src = "https://tikzjax.com/v1/tikzjax.js";\n' +
            '    s.onload = function() {\n' +
            '      setTimeout(function() {\n' +
            '        var msg = document.getElementById("loadingMsg");\n' +
            '        if (msg) msg.style.display = "none";\n' +
            '      }, 3000);\n' +
            '    };\n' +
            '    s.onerror = function() {\n' +
            '      var msg = document.getElementById("loadingMsg");\n' +
            '      if (msg) { msg.textContent = "⚠️ TikZ 렌더링 라이브러리 로드 실패"; msg.style.color = "#e74c3c"; }\n' +
            '    };\n' +
            '    document.head.appendChild(s);\n' +
            '  <\/script>\n</body>\n</html>'
          );
          iframeDoc.close();
        } catch (err) {
          console.error('iframe TikZ 주입 실패:', err);
        }
      });

      return tikzWrapper;
    }

    function createImageLinkBlock(graphicItem) {
      var div = document.createElement('div');
      div.className = 'tikz-container';
      div.innerHTML = '<a href="' + graphicItem.originalUrl + '" target="_blank" style="color:#007bff; text-decoration: none; font-weight: bold;">📷 원본 이미지 보기 (새창)</a>';
      return div;
    }

    function createPlaceholder(index) {
      var div = document.createElement('div');
      div.className = 'image-placeholder';
      div.textContent = '⚠️ 그래픽 #' + index + ' 데이터를 찾을 수 없습니다.';
      return div;
    }

    /* ══════════════════════════════════════════
       GAS 메시지 수신 리스너
    ══════════════════════════════════════════ */
    window.addEventListener('message', function(event) {
      var payloadString = event.data;
      if (!payloadString || typeof payloadString !== 'string') return;
      try {
        var parsed = JSON.parse(payloadString);
        document.getElementById('error-msg').style.display = 'none';
        currentParsedData = parsed;
        renderAll(parsed);
        // 캡처 버튼 활성화
        document.getElementById('captureBar').classList.add('ready');
        document.getElementById('btnCapture').disabled = false;
        document.getElementById('btnDownload').disabled = false;
        document.getElementById('captureStatus').textContent = '✅ Ready to Capture';
      } catch (e) {
        showError('JSON 파싱 에러: ' + e.message);
      }
    });

    /* ══════════════════════════════════════════
       메인 렌더링 (미리보기)
    ══════════════════════════════════════════ */
    function renderAll(parsed) {
      var content = document.getElementById('content');
      content.innerHTML = '';

      var graphicsArr = normalizeGraphics(parsed.graphics);
      var choicesArr = normalizeChoices(parsed.choices);

      var titleDiv = document.createElement('div');
      titleDiv.className = 'q-title';
      titleDiv.textContent = 'Question Preview';
      content.appendChild(titleDiv);

      var bodyText = prepareBody(parsed.body);
      var bodyParts = bodyText.split(/\[image_section\]\s*:\s*(\d+)/);
      var referencedIndices = {};

      for (var i = 0; i < bodyParts.length; i++) {
        if (i % 2 === 0) {
          var textPart = bodyParts[i].trim();
          if (textPart) {
            var textDiv = document.createElement('div');
            textDiv.className = 'q-body';
            textDiv.innerHTML = textPart.replace(/\n/g, '<br>');
            content.appendChild(textDiv);
          }
        } else {
          var gIdx = parseInt(bodyParts[i], 10) - 1;
          referencedIndices[gIdx] = true;
          if (gIdx >= 0 && gIdx < graphicsArr.length) {
            var gItem = graphicsArr[gIdx];
            if (gItem && gItem.isExist && gItem.tikzCode) {
              content.appendChild(createTikzBlock(gItem));
            } else if (gItem && gItem.isExist && gItem.originalUrl) {
              content.appendChild(createImageLinkBlock(gItem));
            } else {
              content.appendChild(createPlaceholder(gIdx + 1));
            }
          } else {
            content.appendChild(createPlaceholder(gIdx + 1));
          }
        }
      }

      graphicsArr.forEach(function(gItem, idx) {
        if (referencedIndices[idx]) return;
        if (gItem && gItem.isExist && gItem.tikzCode) {
          content.appendChild(createTikzBlock(gItem));
        } else if (gItem && gItem.isExist && gItem.originalUrl) {
          content.appendChild(createImageLinkBlock(gItem));
        }
      });

      if (choicesArr.length > 0) {
        var ul = document.createElement('ul');
        ul.className = 'q-choices';
        choicesArr.forEach(function(c) {
          var li = document.createElement('li');
          li.innerHTML = '<span class="choice-index">' + c.index + '.</span> ' + cleanLatex(c.text);
          ul.appendChild(li);
        });
        content.appendChild(ul);
      }

      if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise([content]).catch(function(err) { console.error(err); });
      }
    }

    /* ══════════════════════════════════════════
       PNG 캡처 — 출판 품질 렌더링
    ══════════════════════════════════════════ */

    var captureMode = ''; // 'window' or 'download'

    // 모달 열기/닫기
    function openModal(mode) {
      captureMode = mode;
      var btn = document.getElementById('modalConfirmBtn');
      if (mode === 'download') {
        btn.textContent = '💾 Download';
        btn.className = 'btn-go dl';
      } else {
        btn.textContent = '📸 새 창에서 열기';
        btn.className = 'btn-go';
      }
      // JSON에서 type 자동 선택
      if (currentParsedData && currentParsedData.type) {
        var sel = document.getElementById('qType');
        for (var i = 0; i < sel.options.length; i++) {
          if (sel.options[i].value === currentParsedData.type) {
            sel.selectedIndex = i; break;
          }
        }
      }
      document.getElementById('captureModal').classList.add('active');
      document.getElementById('qNumber').focus();
    }
    function closeModal() {
      document.getElementById('captureModal').classList.remove('active');
    }
    document.getElementById('modalConfirmBtn').addEventListener('click', function() {
      closeModal();
      if (captureMode === 'download') {
        doCapture(function(canvas) {
          var fn = buildFilename();
          var a = document.createElement('a');
          a.href = canvas.toDataURL('image/png');
          a.download = fn + '.png';
          a.click();
        });
      } else {
        doCapture(function(canvas) {
          var dataUrl = canvas.toDataURL('image/png');
          var fn = buildFilename();
          var win = window.open('', '_blank');
          if (win) {
            win.document.write(
              '<!DOCTYPE html><html><head><title>' + fn + '</title>' +
              '<style>body{margin:0;padding:20px;background:#f0f0f0;text-align:center;font-family:sans-serif;}' +
              'img{max-width:100%;box-shadow:0 4px 20px rgba(0,0,0,0.15);border-radius:4px;background:#fff;}' +
              '.info{margin:10px 0 20px;color:#666;font-size:13px;}</style></head><body>' +
              '<div class="info">이미지를 우클릭하여 저장하거나, 아래 버튼을 사용하세요.<br>' +
              '<button onclick="var a=document.createElement(\'a\');a.href=document.querySelector(\'img\').src;a.download=\'' + fn + '.png\';a.click();" ' +
              'style="margin-top:10px;padding:8px 16px;background:#3498db;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:14px;">💾 Download PNG</button></div>' +
              '<img src="' + dataUrl + '">' +
              '</body></html>'
            );
            win.document.close();
          }
        });
      }
    });

    function buildFilename() {
      var num = document.getElementById('qNumber').value.trim() || 'Q';
      var type = document.getElementById('qType').value;
      return num.replace(/[^a-zA-Z0-9가-힣_\-\.]/g, '_') + '_' + type;
    }

    // iframe에서 TikZ SVG 추출 (크기 속성 정리)
    function extractSvgFromIframes() {
      var svgMap = [];
      var iframes = document.querySelectorAll('#content .tikz-container iframe');
      iframes.forEach(function(iframe) {
        try {
          var svg = iframe.contentWindow.document.querySelector('svg');
          if (svg) {
            var clone = svg.cloneNode(true);
            // 인라인 width/height 제거 → CSS로 제어
            clone.removeAttribute('width');
            clone.removeAttribute('height');
            // viewBox가 없으면 원본 크기에서 생성
            if (!clone.getAttribute('viewBox')) {
              var w = svg.getAttribute('width') || svg.getBBox().width;
              var h = svg.getAttribute('height') || svg.getBBox().height;
              if (w && h) clone.setAttribute('viewBox', '0 0 ' + parseFloat(w) + ' ' + parseFloat(h));
            }
            clone.style.cssText = '';
            svgMap.push(clone.outerHTML);
          } else {
            svgMap.push(null);
          }
        } catch (e) {
          svgMap.push(null);
        }
      });
      return svgMap;
    }

    // 캡처 전용 DOM 생성 — 시험지 스타일
    function buildCaptureDOM(parsed, svgMap) {
      var target = document.getElementById('captureTarget');
      target.innerHTML = '';

      var graphicsArr = normalizeGraphics(parsed.graphics);
      var choicesArr = normalizeChoices(parsed.choices);
      var svgIndex = 0;

      var qNum = document.getElementById('qNumber').value.trim();
      var qType = document.getElementById('qType').value;

      // ── 본문 처리: [image_section] 분할 ──
      var bodyText = prepareBody(parsed.body);
      var bodyParts = bodyText.split(/\[image_section\]\s*:\s*(\d+)/);
      var referencedIndices = {};

      // 텍스트 파트를 모아서 첫 번째 텍스트에 문항번호를 붙임
      var firstTextDone = false;

      for (var i = 0; i < bodyParts.length; i++) {
        if (i % 2 === 0) {
          var textPart = bodyParts[i].trim();
          if (textPart) {
            var div = document.createElement('div');
            div.className = 'q-inline-body';
            // 첫 번째 텍스트 블록 앞에 "Câu X: " 삽입
            if (!firstTextDone && qNum) {
              div.innerHTML = '<span class="q-number">' + qNum + ':</span> ' + textPart.replace(/\n/g, '<br>');
              firstTextDone = true;
            } else {
              div.innerHTML = textPart.replace(/\n/g, '<br>');
            }
            target.appendChild(div);
          }
        } else {
          var gIdx = parseInt(bodyParts[i], 10) - 1;
          referencedIndices[gIdx] = true;
          if (gIdx >= 0 && gIdx < graphicsArr.length) {
            var gItem = graphicsArr[gIdx];
            if (gItem && gItem.isExist && gItem.tikzCode) {
              var svgDiv = document.createElement('div');
              svgDiv.className = 'tikz-svg-inline';
              svgDiv.innerHTML = svgMap[svgIndex] || '<div style="color:#999; padding:10px;">[SVG 추출 불가]</div>';
              svgIndex++;
              target.appendChild(svgDiv);
            }
          }
        }
      }

      // 문항번호가 아직 안 들어갔으면 (본문이 비었을 때)
      if (!firstTextDone && qNum) {
        var hDiv = document.createElement('div');
        hDiv.className = 'q-inline-body';
        hDiv.innerHTML = '<span class="q-number">' + qNum + ':</span> ';
        target.insertBefore(hDiv, target.firstChild);
      }

      // ── 참조 안 된 graphics 하단 표시 ──
      graphicsArr.forEach(function(gItem, idx) {
        if (referencedIndices[idx]) return;
        if (gItem && gItem.isExist && gItem.tikzCode) {
          var svgDiv = document.createElement('div');
          svgDiv.className = 'tikz-svg-inline';
          svgDiv.innerHTML = svgMap[svgIndex] || '<div style="color:#999; padding:10px;">[SVG 추출 불가]</div>';
          svgIndex++;
          target.appendChild(svgDiv);
        }
      });

      // ── 선지/하위문항 렌더링 (타입별 분기) ──
      if (qType === 'multiple_choice' && choicesArr.length > 0) {
        // 객관식: 4열 균등 그리드
        var ul = document.createElement('ul');
        ul.className = 'q-choices-grid';
        // 선지 텍스트 최대 길이 측정 → 너무 길면 열 수 줄이기
        var maxLen = 0;
        choicesArr.forEach(function(c) { maxLen = Math.max(maxLen, String(c.text).length); });
        if (maxLen > 40) ul.classList.add('cols-1');
        else if (maxLen > 20) ul.classList.add('cols-2');

        choicesArr.forEach(function(c) {
          var li = document.createElement('li');
          li.innerHTML = '<span class="choice-index">' + c.index + '.</span>' + cleanLatex(c.text);
          ul.appendChild(li);
        });
        target.appendChild(ul);

      } else if (qType === 'true_false' && choicesArr.length > 0) {
        // 참/거짓: a), b), c), d) 형태
        var subLabels = 'abcdefghijklmnopqrstuvwxyz';
        var ul = document.createElement('ul');
        ul.className = 'q-sub-items';
        choicesArr.forEach(function(c, idx) {
          var li = document.createElement('li');
          var label = subLabels[idx] || String(idx + 1);
          li.innerHTML = '<span class="sub-index">' + label + ')</span> ' + cleanLatex(c.text);
          ul.appendChild(li);
        });
        target.appendChild(ul);

      } else if (qType === 'open_ended') {
        // 주관식: 선지 없음 — 별도 처리 불필요
      }

      return target;
    }

    // html2canvas로 PNG 생성
    function doCapture(callback) {
      if (!currentParsedData) { alert('렌더링된 문항이 없습니다.'); return; }

      var status = document.getElementById('captureStatus');
      status.textContent = '⏳ Wait for ready...';

      var svgMap = extractSvgFromIframes();
      var target = buildCaptureDOM(currentParsedData, svgMap);

      target.style.display = 'block';
      target.style.position = 'absolute';
      target.style.left = '-9999px';
      target.style.top = '0';

      var mathjaxPromise = (window.MathJax && MathJax.typesetPromise)
        ? MathJax.typesetPromise([target])
        : Promise.resolve();

      mathjaxPromise.then(function() {
        status.textContent = '⏳ PNG 생성 중...';
        return html2canvas(target, {
          scale: 2,
          backgroundColor: '#ffffff',
          useCORS: true,
          logging: false,
          width: target.scrollWidth,
          height: target.scrollHeight
        });
      }).then(function(canvas) {
        target.style.display = 'none';
        status.textContent = '✅ Done!';
        setTimeout(function() { status.textContent = '✅ Ready to capture'; }, 2000);
        callback(canvas);
      }).catch(function(err) {
        target.style.display = 'none';
        status.textContent = '❌ Fail to capture';
        console.error('Error:', err);
        alert('Error: ' + err.message);
      });
    }

    // 버튼 → 모달 열기
    function captureAsPng() { openModal('window'); }
    function captureAndDownload() { openModal('download'); }

    /* ══════════════════════════════════════════ */
    function showError(msg) {
      var errDiv = document.getElementById('error-msg');
      errDiv.textContent = msg;
      errDiv.style.display = 'block';
    }
  </script>
</body>
</html>
