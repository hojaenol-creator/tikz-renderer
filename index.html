<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>External Full Renderer</title>
  <link rel="stylesheet" type="text/css" href="https://tikzjax.com/v1/fonts.css">
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; margin: 0; color: #333; background: #fff; }
    .q-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #555; border-bottom: 2px solid #eee; padding-bottom: 5px; }
    .q-body { font-size: 16px; line-height: 1.6; margin-bottom: 20px; }
    .q-choices { list-style-type: none; padding: 0; }
    .q-choices li { padding: 10px; margin-bottom: 8px; background: #f8f9fa; border-radius: 6px; border: 1px solid #e9ecef; font-size: 16px; }
    .q-choices li .choice-index { font-weight: bold; color: #007bff; margin-right: 8px; }
    .tikz-container { margin-top: 15px; margin-bottom: 15px; text-align: center; padding: 15px; background: #f8f9fa; border-radius: 8px; border: 1px dashed #ccc; }
    .q-tikz { background: #e9ecef; padding: 10px; font-family: monospace; font-size: 12px; white-space: pre-wrap; margin-top: 10px; text-align: left; }
    #error-msg { color: #fff; background: #ff6b6b; font-weight: bold; display: none; padding: 10px; border-radius: 4px; margin-bottom: 15px; }
    .btn { background: #6c757d; color: white; border: none; padding: 6px 12px; font-size: 12px; cursor: pointer; border-radius: 4px; }
    .btn:hover { background: #5a6268; }
    .image-placeholder { display: inline-block; margin: 10px 0; padding: 6px 12px; background: #fff3cd; border: 1px solid #ffc107; border-radius: 4px; color: #856404; font-size: 13px; }
  </style>

  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
      startup: { typeset: false }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>

  <div id="error-msg"></div>
  <div id="content">
     <h2 style="color:#ccc; text-align:center; margin-top:30vh;">
       👈 '미리보기 렌더링' 버튼을 누르면<br>여기에 문제가 렌더링됩니다.
     </h2>
  </div>

  <script>
    /* ── 유틸리티 함수 ── */

    // 백슬래시 정리 및 특수 공백 제거
    function cleanLatex(str) {
      if (str === null || str === undefined) return "";
      if (typeof str !== 'string') str = String(str);
      return str.replace(/\\\\/g, '\\').replace(/\u00A0/g, ' ');
    }

    // graphics: 이전(단일 객체) / 신규(배열) 모두 호환
    function normalizeGraphics(graphics) {
      if (!graphics) return [];
      if (Array.isArray(graphics)) return graphics;
      return [graphics];
    }

    // choices: 이전(문자열 배열) / 신규({index,text} 배열) 모두 호환
    function normalizeChoices(choices) {
      if (!choices || !Array.isArray(choices)) return [];
      var labels = ['A','B','C','D','E','F','G','H','I','J'];
      return choices.map(function(c, i) {
        if (typeof c === 'string') {
          return { index: labels[i] || String(i + 1), text: c };
        }
        return { index: c.index || labels[i] || String(i + 1), text: c.text || '' };
      });
    }

    /* ── TikZ iframe 블록 생성 ── */
    function createTikzBlock(graphicItem) {
      var cleanTikzCode = cleanLatex(graphicItem.tikzCode);

      var tikzWrapper = document.createElement('div');
      tikzWrapper.className = 'tikz-container';
      tikzWrapper.innerHTML = '<div style="font-weight:bold; color: #007bff; margin-bottom: 10px;">[AI 생성 그래프 (TikZ)]</div>';

      // 원본 이미지 링크
      if (graphicItem.originalUrl) {
        var linkDiv = document.createElement('div');
        linkDiv.style.marginBottom = '10px';
        linkDiv.innerHTML = '<a href="' + graphicItem.originalUrl + '" target="_blank" style="color:#007bff; text-decoration: none; font-weight: bold;">📷 원본 이미지 보기 (새창)</a>';
        tikzWrapper.appendChild(linkDiv);
      }

      // iframe으로 독립된 TikZJax 환경 구성
      var iframe = document.createElement('iframe');
      iframe.style.width = '100%';
      iframe.style.minHeight = '450px';
      iframe.style.border = 'none';
      iframe.style.overflow = 'hidden';
      iframe.style.background = 'transparent';
      iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin');
      tikzWrapper.appendChild(iframe);

      // 토글 버튼 및 원본 코드
      var toggleArea = document.createElement('div');
      toggleArea.style.marginTop = '10px';

      var toggleBtn = document.createElement('button');
      toggleBtn.className = 'btn';
      toggleBtn.textContent = '💻 원본 TikZ 코드 보기/숨기기';

      var rawCodeDiv = document.createElement('div');
      rawCodeDiv.className = 'q-tikz';
      rawCodeDiv.style.display = 'none';
      rawCodeDiv.textContent = cleanTikzCode;

      toggleBtn.addEventListener('click', function() {
        rawCodeDiv.style.display = (rawCodeDiv.style.display === 'none') ? 'block' : 'none';
      });

      toggleArea.appendChild(toggleBtn);
      toggleArea.appendChild(rawCodeDiv);
      tikzWrapper.appendChild(toggleArea);

      // iframe 내부 HTML 주입 (DOM 삽입 후 실행)
      var iframeRef = iframe;
      var tikzCode = cleanTikzCode;
      requestAnimationFrame(function() {
        try {
          var iframeDoc = iframeRef.contentWindow.document;
          iframeDoc.open();
          iframeDoc.write(
            '<!DOCTYPE html>\n<html>\n<head>\n' +
            '  <meta charset="utf-8">\n' +
            '  <link rel="stylesheet" type="text/css" href="https://tikzjax.com/v1/fonts.css">\n' +
            '  <style>\n' +
            '    body { margin: 0; padding: 10px; text-align: center; background: transparent; overflow: hidden; }\n' +
            '    svg { max-width: 100%; height: auto; display: inline-block; }\n' +
            '    .tikz-loading { color: #999; font-family: "Segoe UI", sans-serif; font-size: 14px; text-align: center; padding: 20px; }\n' +
            '  </style>\n</head>\n<body>\n' +
            '  <div class="tikz-loading" id="loadingMsg">⏳ TikZ 그래프 렌더링 중...</div>\n' +
            '  <script type="text/tikz">\n' + tikzCode + '\n  <\/script>\n' +
            '  <script>\n' +
            '    var s = document.createElement("script");\n' +
            '    s.src = "https://tikzjax.com/v1/tikzjax.js";\n' +
            '    s.onload = function() {\n' +
            '      setTimeout(function() {\n' +
            '        var msg = document.getElementById("loadingMsg");\n' +
            '        if (msg) msg.style.display = "none";\n' +
            '      }, 3000);\n' +
            '    };\n' +
            '    s.onerror = function() {\n' +
            '      var msg = document.getElementById("loadingMsg");\n' +
            '      if (msg) { msg.textContent = "⚠️ TikZ 렌더링 라이브러리 로드 실패"; msg.style.color = "#e74c3c"; }\n' +
            '    };\n' +
            '    document.head.appendChild(s);\n' +
            '    var resizeDone = false;\n' +
            '    var observer = new MutationObserver(function() {\n' +
            '      if (resizeDone) return;\n' +
            '      var svg = document.querySelector("svg");\n' +
            '      if (svg) {\n' +
            '        resizeDone = true;\n' +
            '        observer.disconnect();\n' +
            '        var rect = svg.getBoundingClientRect();\n' +
            '        var height = Math.ceil(rect.height) + 30;\n' +
            '        window.parent.postMessage({ type: "tikz-resize", height: height }, "*");\n' +
            '      }\n' +
            '    });\n' +
            '    observer.observe(document.body, { childList: true, subtree: true });\n' +
            '  <\/script>\n</body>\n</html>'
          );
          iframeDoc.close();
        } catch (err) {
          console.error('iframe TikZ 주입 실패:', err);
        }
      });

      return tikzWrapper;
    }

    /* ── 원본 이미지만 있는 graphic용 블록 ── */
    function createImageLinkBlock(graphicItem) {
      var div = document.createElement('div');
      div.className = 'tikz-container';
      div.innerHTML = '<a href="' + graphicItem.originalUrl + '" target="_blank" style="color:#007bff; text-decoration: none; font-weight: bold;">📷 원본 이미지 보기 (새창)</a>';
      return div;
    }

    /* ── 플레이스홀더 경고 블록 ── */
    function createPlaceholder(index) {
      var div = document.createElement('div');
      div.className = 'image-placeholder';
      div.textContent = '⚠️ 그래픽 #' + index + ' 데이터를 찾을 수 없습니다.';
      return div;
    }

    /* ── GAS 메시지 수신 리스너 ── */
    window.addEventListener('message', function(event) {
      var payloadString = event.data;
      if (!payloadString || typeof payloadString !== 'string') return;

      // tikz-resize 메시지 무시
      try {
        var test = JSON.parse(payloadString);
        if (test && test.type === 'tikz-resize') return;
      } catch(e) { /* not JSON or not resize, continue */ }

      try {
        var parsed = JSON.parse(payloadString);
        document.getElementById('error-msg').style.display = 'none';
        renderAll(parsed);
      } catch (e) {
        showError('JSON 파싱 에러: ' + e.message);
      }
    });

    /* ── 메인 렌더링 함수 ── */
    function renderAll(parsed) {
      var content = document.getElementById('content');
      content.innerHTML = '';

      var graphicsArr = normalizeGraphics(parsed.graphics);
      var choicesArr = normalizeChoices(parsed.choices);

      // 1. 타이틀
      var titleDiv = document.createElement('div');
      titleDiv.className = 'q-title';
      titleDiv.textContent = '문항 미리보기';
      content.appendChild(titleDiv);

      // 2. 본문 — [image_section]: N 플레이스홀더를 기준으로 분할
      var bodyText = cleanLatex(parsed.body || "");
      var bodyParts = bodyText.split(/\[image_section\]\s*:\s*(\d+)/);
      // 결과: [텍스트0, 번호1, 텍스트2, 번호3, ...]

      var referencedIndices = {};

      for (var i = 0; i < bodyParts.length; i++) {
        if (i % 2 === 0) {
          // 텍스트 파트
          var textPart = bodyParts[i].trim();
          if (textPart) {
            var textDiv = document.createElement('div');
            textDiv.className = 'q-body';
            textDiv.innerHTML = textPart.replace(/\n/g, '<br>');
            content.appendChild(textDiv);
          }
        } else {
          // [image_section]: N → 0-based index로 변환
          var gIdx = parseInt(bodyParts[i], 10) - 1;
          referencedIndices[gIdx] = true;

          if (gIdx >= 0 && gIdx < graphicsArr.length) {
            var gItem = graphicsArr[gIdx];
            if (gItem && gItem.isExist && gItem.tikzCode) {
              content.appendChild(createTikzBlock(gItem));
            } else if (gItem && gItem.isExist && gItem.originalUrl) {
              content.appendChild(createImageLinkBlock(gItem));
            } else {
              content.appendChild(createPlaceholder(gIdx + 1));
            }
          } else {
            content.appendChild(createPlaceholder(gIdx + 1));
          }
        }
      }

      // 3. 본문에서 참조되지 않은 나머지 graphics를 하단에 표시
      graphicsArr.forEach(function(gItem, idx) {
        if (referencedIndices[idx]) return;
        if (gItem && gItem.isExist && gItem.tikzCode) {
          content.appendChild(createTikzBlock(gItem));
        } else if (gItem && gItem.isExist && gItem.originalUrl) {
          content.appendChild(createImageLinkBlock(gItem));
        }
      });

      // 4. 객관식 보기
      if (choicesArr.length > 0) {
        var ul = document.createElement('ul');
        ul.className = 'q-choices';
        choicesArr.forEach(function(c) {
          var li = document.createElement('li');
          li.innerHTML = '<span class="choice-index">' + c.index + '.</span> ' + cleanLatex(c.text);
          ul.appendChild(li);
        });
        content.appendChild(ul);
      }

      // 5. MathJax 렌더링 트리거
      if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise([content]).catch(function(err) { console.error(err); });
      }
    }

    /* ── iframe 높이 자동 조절 수신 ── */
    window.addEventListener('message', function(event) {
      if (event.data && event.data.type === 'tikz-resize') {
        var targetHeight = Math.min(event.data.height, 800); // 최대 800px 제한
        var iframes = document.querySelectorAll('.tikz-container iframe');
        iframes.forEach(function(iframe) {
          try {
            if (iframe.contentWindow === event.source) {
              iframe.style.height = targetHeight + 'px';
              iframe.style.minHeight = '0'; // 초기 minHeight 제거
            }
          } catch (e) { /* cross-origin 무시 */ }
        });
      }
    });

    function showError(msg) {
      var errDiv = document.getElementById('error-msg');
      errDiv.textContent = msg;
      errDiv.style.display = 'block';
    }
  </script>
</body>
</html>
